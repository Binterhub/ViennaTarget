<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeoTarget Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/login.css" />
    <script src="/login.js" defer></script>
  </head>
  <body class="login-page">
    <div class="login-shell">
      <section class="login-hero" aria-label="DataDominance Know Your Client">
        <img
          src="/assets/datadominance-login-hero.jpg"
          alt="DataDominance by Evolantis — Know Your Client"
          width="1024"
          height="438"
        />
      </section>

      <section class="login-panel">
        <p class="login-brand">NeoTarget</p>
        <h1>Zugang</h1>
        <p class="login-lead">
          Doctor-Targeting mit Fokus auf
          <strong>Neonatologie und pädriatrische Intensivmedizin</strong>.
        </p>
        <form id="login-form" class="login-form" autocomplete="current-password">
          <label class="login-field">
            <span>Passwort</span>
            <input
              id="password"
              name="password"
              type="password"
              required
              autofocus
              minlength="1"
              placeholder="Passwort eingeben"
            />
          </label>
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button type="submit" id="login-submit" class="login-submit">Anmelden</button>
        </form>
        <p class="login-foot">DataDominance by Evolantis · Know Your Client</p>
      </section>
    </div>
  </body>
</html>
